name: Mobile (Flutter)

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["mobile/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Repo secrets (Settings → Secrets → Actions): SUPABASE_URL, SUPABASE_ANON_KEY,
      # and optionally WEB_BASE_URL. The anon key is public by design.
      # Optional release signing. Add these repo secrets (Settings → Secrets → Actions) and the
      # build is signed with your upload key; without them it falls back to the debug key (test only).
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Set up release signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/mobile/android/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          fi
      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=WEB_BASE_URL=${{ secrets.WEB_BASE_URL }}
      - name: Build Play Store bundle
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=WEB_BASE_URL=${{ secrets.WEB_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: diamond-solution-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: diamond-solution-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
